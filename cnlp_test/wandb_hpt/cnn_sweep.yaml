# 修正后的CNN sweep配置
project: VIB-Intepretable-Text-Classification
program: wandb_cnlp_cnn_train.py
method: grid
metric:
  name: final_metric
  goal: maximize

parameters:
  # 🚫 删除encoder_name（CNN不需要）
  # encoder_name:  # 删除这个参数
  
  # ✅ 添加tokenizer_name（CNN必需）
  tokenizer_name:
    values: ['bionlp/bluebert_pubmed_uncased_L-24_H-1024_A-16'] # 1
  
  # 保持不变的参数
  learning_rate:
    values: [1e-6, 5e-6, 1e-5, 5e-5, 1e-4, 5e-4] # 6
  batch_size:
    values: [4, 8, 16, 32] # 4
  early_stopping_threshold:
    values: [0.01] # 1
  
  lr_scheduler_type:
    values: ["linear", "cosine"] # 2
  
  # CNN特定参数
  model:
    value: "cnn"
  
  cnn_embed_dim:
    values: [64, 100, 128, 200] # 4
  
  cnn_num_filters:
    values: [16, 25, 32, 50] # 4
  
  cnn_filter_sizes:
    values:
      - "1,2,3"          # 传递 "1,2,3" 字符串
      - "1,2,3,4"        # 传递 "1,2,3,4" 字符串
      - "1,2,3,4,5"
    # 3种配置
