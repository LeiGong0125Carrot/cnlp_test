# 优化的CNN配置 - 目标达到27% F1 for class 1
project: Concept-Text-Classification
program: wandb_cnlp_cnn_train.py
method: grid
metric:
  name: f1_class_1
  goal: maximize

parameters:
  tokenizer_name:
    values: ['bionlp/bluebert_pubmed_uncased_L-24_H-1024_A-16']
  
  # 关键改进1: 使用更低的学习率
  learning_rate:
    values: [2e-6]  # 降低100倍
  
  # 批次大小 - 使用proven的配置
  batch_size:
    values: [4]
  
  # 调度器选择
  lr_scheduler_type:
    values: ["cosine", "linear"]
  
  # CNN架构优化
  model:
    value: "cnn"
  
  max_seq_length:
    values: [8192]
  
  cnn_embed_dim:
    values: [512]  # 探索更大的嵌入
  
  warmup_steps:
    value: 5000

  cnn_num_filters:
    values: [500, 50]  # 平衡的过滤器数量
  
  cnn_filter_sizes:
    values:
      # - "1,2,3"
      # - "3,4,5"          # 经典Kim配置
      # - "2,3,4,5,6"      # proven配置
      # - "3,4,5,6,7"      # 较大的过滤器
      # - "2,4,6,8,10"     # 更大的filter sizes适应长序列
      # - "3,5,7,9"        # 奇数filter sizes
      - "5,10,15,20,25" 
      - "2,4,6,8,10,12"
      - "10,20,30,40,50"     # 长距离依赖
      - "3,5,7,11,15,21"     # 指数增长
      - "1,3,5,10,20,50"     # 混合短中长
      - "5,15,30,50,100"     # 超长距离模式


  
  # 训练配置
  num_train_epochs:
    values: [100]  # 更多训练轮数
  
  gradient_accumulation_steps:
    values: [2, 4, 6]
  
  # 早停参数调整
  early_stopping_threshold:
    values: [0.005]  # 更严格的阈值
  
  early_stopping_patience:
    values: [40]  # 更多耐心

# 额外建议（需要修改训练代码）:
# 1. 添加class weight调整: [1.0, 20.0] for [class_0, class_1]
# 2. 使用focal loss替代cross entropy
# 3. 添加dropout层 (0.3-0.5)
# 4. 使用label smoothing (0.1)
# 5. 数据增强: 同义词替换、随机删除等