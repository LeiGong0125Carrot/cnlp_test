# LSTM sweep配置
project: VIB-Intepretable-Text-Classification
name: lstm_sweep
program: wandb_cnlp_lstm_train.py
method: grid
metric:
  name: final_metric
  goal: maximize

parameters:
  # ✅ 添加tokenizer_name（CNN必需）
  tokenizer_name:
    values: ['bionlp/bluebert_pubmed_uncased_L-24_H-1024_A-16'] # 1
  
  # 保持不变的参数
  model:
    value: "lstm"
  learning_rate:
    values: [1e-6, 5e-6, 1e-5, 5e-5, 1e-4, 5e-4] # 6
  batch_size:
    values: [4, 8, 16, 32] # 4
  early_stopping_threshold:
    values: [0.01] # 1
  
  lstm_embed_dim:
    values: [64, 100, 128, 200, 256]  # 5个值

  lstm_hidden_size:
    values: [64, 100, 128, 200, 256, 512]  # 6个值
